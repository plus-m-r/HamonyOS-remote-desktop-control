name: remote_desktop_control
description: "HarmonyOS Remote Desktop Control - Flutter Client UI"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.7
  
  # State Management
  get: ^4.6.5
  provider: ^6.0.0
  
  # Networking
  dio: ^5.3.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  get_storage: ^2.1.1
  
  # Utilities
  intl: ^0.19.0
  logger: ^2.0.1
  uuid: ^4.0.0
  
  # Video/Image Handling
  video_player: ^2.8.1
  image: ^4.1.3
  
  # Device Features
  permission_handler: ^11.4.3
  device_info_plus: ^9.1.1
  
  # WebSocket (for real-time features)
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/logos/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
